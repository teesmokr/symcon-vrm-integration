name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0)'
        required: true
        default: 'v1.0'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: Victron VRM Energiemonitor ${{ github.event.inputs.tag }}
          draft: false
          prerelease: false
          body: |
            IP-Symcon-Modul, das die Live-Werte einer Victron-Anlage über die
            VRM Cloud-API holt und als GUIv2-artige Energiefluss-Kachel darstellt.

            **Funktionen**
            - PV, Batterie (SOC/Spannung/Leistung), Netz (mit Phasen) und Verbrauch (AC/DC)
            - GUIv2-Kachel mit Batterie-SOC-Ring, animierten Flussbögen, Light- & Dark-Mode
            - Automatische Wert-Erkennung + manuelle Code-Overrides + Code-Explorer
            - Anlagen-Auswahl direkt im Konfigurationsformular

            **Installation**
            In IP-Symcon (ab 7.1) über das Module Control diese Repository-URL hinzufügen
            und eine Instanz „Victron VRM Energiemonitor" anlegen.

            **Hinweis:** Die Diagnostics-Codes variieren je Anlage – bei Bedarf über
            „Verfügbare Codes auflisten" die Overrides setzen.
