<!-- Victron VRM Energiemonitor – GUIv2-artige Energiefluss-Kachel (Light/Dark) -->
<style>
    .vrm {
        --bg: #f4f3ee;
        --track: #cfe0f4;
        --arc: #cbdcf0;
        --ring: #2f7ed8;
        --text: #2b2f36;
        --muted: #9aa1a9;
        --solar: #e6a51e;
        --grid: #2f6fd0;
        --load: #3f4650;
        --active: #6ab04c;
        --consumption: #e0663c;
        box-sizing: border-box;
        width: 100%;
        background: var(--bg);
        border-radius: 12px;
        padding: 8px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
        .vrm:not([data-theme="light"]) {
            --bg: #11151c;
            --track: #24313f;
            --arc: #2a3a4d;
            --ring: #4a90d9;
            --text: #e8edf3;
            --muted: #7c8794;
            --solar: #f2b134;
            --grid: #5a9be0;
            --load: #c7cdd6;
            --active: #6ab04c;
            --consumption: #e0663c;
        }
    }
    .vrm[data-theme="dark"] {
        --bg: #11151c; --track: #24313f; --arc: #2a3a4d; --ring: #4a90d9;
        --text: #e8edf3; --muted: #7c8794; --solar: #f2b134; --grid: #5a9be0;
        --load: #c7cdd6; --active: #6ab04c; --consumption: #e0663c;
    }
    .vrm svg { display: block; width: 100%; height: auto; }
    .vrm .val { fill: var(--text); font-weight: 600; }
    .vrm .unit { fill: var(--muted); font-weight: 500; }
    .vrm .lbl { fill: var(--muted); }
    .vrm .track { fill: none; stroke: var(--arc); stroke-width: 6; stroke-linecap: round; }
    .vrm .fill { fill: none; stroke-width: 6; stroke-linecap: round; }
    .vrm .pnum { fill: var(--muted); font-weight: 600; }

    /* Responsives Portrait-Layout für schmale/mobile Kacheln */
    .vrm #vrmNarrow { display: none; }
    @media (max-width: 600px) {
        .vrm #vrmWide { display: none; }
        .vrm #vrmNarrow { display: block; }
    }
    .vrm .nring { display: block; width: 62%; max-width: 240px; height: auto; margin: 6px auto 14px; }
    .vrm .nrows { display: flex; flex-direction: column; gap: 12px; padding: 0 6px 8px; }
    .vrm .nrow.hidden { display: none; }
    .vrm .nhead { display: flex; align-items: center; gap: 9px; }
    .vrm .ndot { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; }
    .vrm .nlabel { color: var(--muted); font-size: 15px; flex: 1; }
    .vrm .nval { color: var(--muted); font-weight: 500; font-size: 15px; white-space: nowrap; }
    .vrm .nval span { color: var(--text); font-weight: 700; font-size: 22px; }
    .vrm .nbarwrap { margin-top: 6px; height: 8px; border-radius: 6px; background: var(--arc); overflow: hidden; }
    .vrm .nbar { height: 100%; width: 0; border-radius: 6px; transition: width .3s ease; }
</style>

<div class="vrm" id="vrm">
    <div id="vrmWide">
    <svg viewBox="0 0 1200 560" preserveAspectRatio="xMidYMid meet" aria-label="Victron Energy">
        <!-- dynamisch erzeugte Auslastungsbalken -->
        <g id="vrmArcs"></g>

        <!-- SOC-Ring -->
        <circle cx="600" cy="260" r="155" fill="none" stroke="var(--track)" stroke-width="20"/>
        <circle id="vrmRing" cx="600" cy="260" r="155" fill="none" stroke="var(--ring)"
                stroke-width="20" stroke-linecap="round"
                transform="rotate(-90 600 260)" stroke-dasharray="974" stroke-dashoffset="974"/>

        <!-- Batterie-Zentrum -->
        <g>
            <g transform="translate(538 172)">
                <rect x="0" y="1" width="20" height="13" rx="2.5" fill="none" stroke="var(--text)" stroke-width="2"/>
                <line x1="20" y1="4.5" x2="23" y2="4.5" stroke="var(--text)" stroke-width="2.4" stroke-linecap="round"/>
                <path d="M11 3 L7.5 8.5 L11 8.5 L8 12.5" fill="none" stroke="var(--text)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
            </g>
            <text class="val" x="570" y="190" font-size="30" font-weight="500" text-anchor="start">Batterie</text>
            <text x="600" y="298" font-size="104" text-anchor="middle">
                <tspan class="val" id="vrmSoc" font-weight="700">–</tspan><tspan class="unit" font-size="60">%</tspan>
            </text>
            <text class="val" x="600" y="340" font-size="28" font-weight="500" text-anchor="middle" id="vrmBattSub">– V   – W</text>
        </g>

        <!-- Netz (links oben) -->
        <g id="vrmGrid" transform="translate(140 215)">
            <path d="M-6 -34 l14 8 l-14 8 z" fill="var(--ring)" id="vrmGridArrow"/>
            <g stroke="var(--load)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(-4 -14)">
                <path d="M2 0 h12 l-2 10 h-8 z"/><path d="M4 10 l-3 20 M12 10 l3 20 M0 20 h16"/>
            </g>
            <text x="26" y="8" font-size="52" text-anchor="start"><tspan class="val" id="vrmGridVal">–</tspan><tspan class="unit" font-size="34"> W</tspan></text>
            <g id="vrmGridPhases" transform="translate(-4 24)"></g>
        </g>

        <!-- Solar (links unten) -->
        <g id="vrmSolar" transform="translate(140 330)">
            <g stroke="var(--solar)" stroke-width="2.4" fill="none" stroke-linecap="round" transform="translate(-2 -12)">
                <circle cx="8" cy="8" r="4.5"/>
                <path d="M8 -1 v-3 M8 17 v3 M1 8 h-3 M15 8 h3 M3 3 l-2 -2 M13 13 l2 2 M13 3 l2 -2 M3 13 l-2 2"/>
            </g>
            <text x="26" y="8" font-size="52" text-anchor="start"><tspan class="val" id="vrmSolarVal">–</tspan><tspan class="unit" font-size="34"> W</tspan></text>
        </g>

        <!-- AC-Verbrauch (rechts oben) -->
        <g id="vrmAc" transform="translate(1060 215)">
            <text x="-30" y="8" font-size="52" text-anchor="end"><tspan class="val" id="vrmAcVal">–</tspan><tspan class="unit" font-size="34"> W</tspan></text>
            <path d="M0 0 q4 -9 8 0 q4 9 8 0" transform="translate(-24 -6)" fill="none" stroke="var(--load)" stroke-width="2.4" stroke-linecap="round"/>
            <g id="vrmAcPhases" transform="translate(-40 24)"></g>
        </g>

        <!-- DC-Last (rechts unten) -->
        <g id="vrmDc" transform="translate(1060 330)">
            <text x="-30" y="8" font-size="52" text-anchor="end"><tspan class="val" id="vrmDcVal">–</tspan><tspan class="unit" font-size="34"> W</tspan></text>
            <g transform="translate(-24 -8)" stroke="var(--load)" stroke-width="2.4" stroke-linecap="round">
                <line x1="0" y1="2" x2="16" y2="2"/><line x1="3" y1="9" x2="13" y2="9" stroke-dasharray="3 3"/>
            </g>
        </g>

        <!-- Zusätzlicher Verbraucher (unten, optional) -->
        <g id="vrmExtra" transform="translate(600 498)" text-anchor="middle" style="display:none">
            <text class="lbl" x="0" y="0" font-size="20" id="vrmExtraName">Verbraucher</text>
            <text x="0" y="32" font-size="34" text-anchor="middle"><tspan class="val" id="vrmExtraVal">–</tspan><tspan class="unit" font-size="24"> W</tspan></text>
        </g>
    </svg>
    </div>

    <!-- Portrait-/Mobil-Layout -->
    <div id="vrmNarrow">
        <svg class="nring" viewBox="0 0 300 300" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
            <circle cx="150" cy="150" r="120" fill="none" stroke="var(--track)" stroke-width="16"/>
            <circle id="vrmRingN" cx="150" cy="150" r="120" fill="none" stroke="var(--ring)"
                    stroke-width="16" stroke-linecap="round"
                    transform="rotate(-90 150 150)" stroke-dasharray="754" stroke-dashoffset="754"/>
            <text class="lbl" x="150" y="118" font-size="20" text-anchor="middle">Batterie</text>
            <text x="150" y="176" font-size="64" text-anchor="middle"><tspan class="val" id="vrmSocN" font-weight="700">–</tspan><tspan class="unit" font-size="36">%</tspan></text>
            <text class="val" x="150" y="208" font-size="18" text-anchor="middle" id="vrmBattSubN">– V  – W</text>
        </svg>
        <div class="nrows">
            <div class="nrow" id="rowGrid">
                <div class="nhead"><span class="ndot" style="background:var(--ring)"></span><span class="nlabel">Netz</span><span class="nval"><span id="nvalGrid">–</span> W</span></div>
                <div class="nbarwrap"><div class="nbar" id="nbarGrid"></div></div>
            </div>
            <div class="nrow" id="rowSolar">
                <div class="nhead"><span class="ndot" style="background:var(--solar)"></span><span class="nlabel">Solar</span><span class="nval"><span id="nvalSolar">–</span> W</span></div>
                <div class="nbarwrap"><div class="nbar" id="nbarSolar"></div></div>
            </div>
            <div class="nrow" id="rowAc">
                <div class="nhead"><span class="ndot" style="background:var(--ring)"></span><span class="nlabel">Verbrauch</span><span class="nval"><span id="nvalAc">–</span> W</span></div>
                <div class="nbarwrap"><div class="nbar" id="nbarAc"></div></div>
            </div>
            <div class="nrow" id="rowDc">
                <div class="nhead"><span class="ndot" style="background:var(--ring)"></span><span class="nlabel">DC-Last</span><span class="nval"><span id="nvalDc">–</span> W</span></div>
                <div class="nbarwrap"><div class="nbar" id="nbarDc"></div></div>
            </div>
            <div class="nrow" id="rowExtra">
                <div class="nhead"><span class="ndot" style="background:var(--consumption)"></span><span class="nlabel" id="nlabelExtra">Verbraucher</span><span class="nval"><span id="nvalExtra">–</span> W</span></div>
                <div class="nbarwrap"><div class="nbar" id="nbarExtra"></div></div>
            </div>
        </div>
    </div>
</div>

<script>
    (function () {
        var initial = /*__INITIAL_DATA__*/null;
        var CX = 600, CY = 260, RING = 155, C = 2 * Math.PI * RING;
        var THR = 3; // W Rauschschwelle

        function polar(r, deg) {
            var a = deg * Math.PI / 180;
            return [CX + r * Math.cos(a), CY - r * Math.sin(a)];
        }
        function arcD(r, d1, d2) {
            var p1 = polar(r, d1), p2 = polar(r, d2);
            var large = Math.abs(d2 - d1) > 180 ? 1 : 0;
            var sweep = d2 > d1 ? 0 : 1;
            return 'M' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1) +
                   ' A' + r + ' ' + r + ' 0 ' + large + ' ' + sweep + ' ' +
                   p2[0].toFixed(1) + ' ' + p2[1].toFixed(1);
        }
        function fmt(v) { return String(Math.round(v)); }
        function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }

        // Auslastungsbalken je Quelle/Last. src = Wertseite, ring = Ringseite.
        var ARCS = {
            grid:  { r: 205, src: 140, ring: 178 },
            solar: { r: 205, src: 220, ring: 182 },
            ac:    { r: 205, src: 40,  ring: 2 },
            dc:    { r: 205, src: 320, ring: 358 },
            extra: { r: 205, src: 250, ring: 290 }
        };

        var SVGNS = 'http://www.w3.org/2000/svg';
        function el(name, attrs) {
            var e = document.createElementNS(SVGNS, name);
            for (var k in attrs) { e.setAttribute(k, attrs[k]); }
            return e;
        }

        // Zeichnet einen 0–100 %-Auslastungsbalken: Track (hell) + Füllung (farbig).
        function buildBar(group, def, value, max, color) {
            group.appendChild(el('path', { d: arcD(def.r, def.src, def.ring), class: 'track' }));
            var v = Math.abs(value || 0);
            if (v <= THR) { return; }
            var pct = max > 0 ? clamp01(v / max) : 1; // ohne Maximum: voll, wenn aktiv
            var end = def.src + (def.ring - def.src) * pct;
            var fill = el('path', { d: arcD(def.r, def.src, end), class: 'fill' });
            fill.setAttribute('stroke', color);
            group.appendChild(fill);
        }

        function hasValues(arr) {
            return arr && arr.some(function (p) { return p !== null && p !== undefined; });
        }

        // Zeichnet je Phase einen kleinen Balken (konzentrisch); ohne Phasendaten einen Gesamt-Balken.
        function drawSource(group, def, total, phases, maxTotal, color, showMask) {
            if (hasValues(phases)) {
                var radii = [def.r, def.r - 10, def.r - 20];
                var pmax = maxTotal > 0 ? maxTotal / 3 : 0;
                for (var i = 0; i < 3; i++) {
                    if (phases[i] === null || phases[i] === undefined) { continue; }
                    if (showMask && showMask[i] === false) { continue; }
                    buildBar(group, { r: radii[i], src: def.src, ring: def.ring }, phases[i], pmax, color);
                }
            } else {
                buildBar(group, def, total, maxTotal, color);
            }
        }

        function phaseDots(group, phases, activeColor) {
            while (group.firstChild) { group.removeChild(group.firstChild); }
            for (var i = 0; i < 3; i++) {
                var on = phases && phases.length
                    ? (phases[i] !== null && phases[i] !== undefined && Math.abs(phases[i]) > THR)
                    : false;
                var x = i * 16;
                var dot = el('circle', { cx: x, cy: 0, r: 4, fill: on ? activeColor : 'var(--muted)' });
                dot.style.opacity = on ? '1' : '0.45';
                group.appendChild(dot);
                var t = el('text', { x: x, y: 20, 'font-size': 15, 'text-anchor': 'middle', class: 'pnum' });
                t.textContent = String(i + 1);
                group.appendChild(t);
            }
        }

        function render(d) {
            if (!d) return;
            var soc = (d.soc === null || d.soc === undefined) ? null : d.soc;
            var pv = d.pv || 0, grid = d.grid || 0, batt = d.battPower || 0;
            var ac = d.consumption || 0, dc = d.dc || 0;

            var ring = document.getElementById('vrmRing');
            var pct = soc === null ? 0 : Math.max(0, Math.min(100, soc));
            ring.setAttribute('stroke-dashoffset', String(C * (1 - pct / 100)));
            document.getElementById('vrmSoc').textContent = soc === null ? '–' : Math.round(soc);
            var v = (d.battVoltage === null || d.battVoltage === undefined) ? null : d.battVoltage;
            document.getElementById('vrmBattSub').textContent =
                (v === null ? '–' : v.toFixed(2).replace('.', ',') + ' V') + '  ' + fmt(batt) + ' W';

            document.getElementById('vrmGridVal').textContent = fmt(grid);
            document.getElementById('vrmSolarVal').textContent = fmt(pv);
            document.getElementById('vrmAcVal').textContent = fmt(ac);
            document.getElementById('vrmDcVal').textContent = fmt(dc);
            document.getElementById('vrmGridArrow').style.opacity = Math.abs(grid) > THR ? '1' : '0';

            phaseDots(document.getElementById('vrmGridPhases'), d.gridPhases, 'var(--active)');
            phaseDots(document.getElementById('vrmAcPhases'), d.consPhases, 'var(--ring)');

            // Sichtbarkeit der Knoten
            var show = d.show || {};
            var vis = function (id, on) {
                var g = document.getElementById(id);
                if (g) { g.style.display = (on === false) ? 'none' : ''; }
            };
            var showGrid = show.grid !== false, showSolar = show.solar !== false;
            var showCons = show.consumption !== false, showDc = show.dc !== false;
            vis('vrmGrid', showGrid);
            vis('vrmSolar', showSolar);
            vis('vrmAc', showCons);
            vis('vrmDc', showDc);
            var solarMask = show.solarPhases || null;

            // Zusätzlicher Verbraucher (optional)
            var extra = d.extra && d.extra.enabled ? d.extra : null;
            var extraGroup = document.getElementById('vrmExtra');
            if (extra) {
                extraGroup.style.display = '';
                document.getElementById('vrmExtraName').textContent = extra.name || 'Verbraucher';
                document.getElementById('vrmExtraVal').textContent = fmt(extra.value || 0);
            } else {
                extraGroup.style.display = 'none';
            }

            var arcs = document.getElementById('vrmArcs');
            while (arcs.firstChild) { arcs.removeChild(arcs.firstChild); }
            if (showSolar) { drawSource(arcs, ARCS.solar, pv, d.solarPhases, d.maxPv, 'var(--solar)', solarMask); }
            if (showGrid) { drawSource(arcs, ARCS.grid, grid, d.gridPhases, d.maxGrid, 'var(--ring)', null); }
            if (showCons) { drawSource(arcs, ARCS.ac, ac, d.consPhases, d.maxConsumption, 'var(--ring)', null); }
            if (showDc) { buildBar(arcs, ARCS.dc, dc, d.maxDc, 'var(--ring)'); }
            if (extra) { buildBar(arcs, ARCS.extra, extra.value, extra.max, 'var(--consumption)'); }

            renderNarrow(d, { soc: soc, pct: pct, v: v, grid: grid, pv: pv, batt: batt,
                ac: ac, dc: dc, extra: extra, showGrid: showGrid, showSolar: showSolar,
                showCons: showCons, showDc: showDc });
        }

        function util(value, max) {
            var v = Math.abs(value || 0);
            if (v <= THR) { return 0; }
            return (max > 0 ? clamp01(v / max) : 1) * 100;
        }

        function nrow(rowId, valId, barId, value, max, color, showFlag) {
            var row = document.getElementById(rowId);
            if (!row) { return; }
            if (showFlag === false) { row.classList.add('hidden'); return; }
            row.classList.remove('hidden');
            document.getElementById(valId).textContent = fmt(value);
            var bar = document.getElementById(barId);
            bar.style.width = util(value, max) + '%';
            bar.style.background = color;
        }

        function renderNarrow(d, c) {
            var ringN = document.getElementById('vrmRingN');
            if (!ringN) { return; }
            var CN = 2 * Math.PI * 120;
            ringN.setAttribute('stroke-dashoffset', String(CN * (1 - c.pct / 100)));
            document.getElementById('vrmSocN').textContent = c.soc === null ? '–' : Math.round(c.soc);
            document.getElementById('vrmBattSubN').textContent =
                (c.v === null ? '–' : c.v.toFixed(2).replace('.', ',') + ' V') + '  ' + fmt(c.batt) + ' W';

            nrow('rowGrid', 'nvalGrid', 'nbarGrid', c.grid, d.maxGrid, 'var(--ring)', c.showGrid);
            nrow('rowSolar', 'nvalSolar', 'nbarSolar', c.pv, d.maxPv, 'var(--solar)', c.showSolar);
            nrow('rowAc', 'nvalAc', 'nbarAc', c.ac, d.maxConsumption, 'var(--ring)', c.showCons);
            nrow('rowDc', 'nvalDc', 'nbarDc', c.dc, d.maxDc, 'var(--ring)', c.showDc);

            if (c.extra) {
                document.getElementById('nlabelExtra').textContent = c.extra.name || 'Verbraucher';
                nrow('rowExtra', 'nvalExtra', 'nbarExtra', c.extra.value || 0, c.extra.max, 'var(--consumption)', true);
            } else {
                nrow('rowExtra', 'nvalExtra', 'nbarExtra', 0, 0, 'var(--consumption)', false);
            }
        }

        window.handleMessage = function (data) {
            try { render(typeof data === 'string' ? JSON.parse(data) : data); } catch (e) {}
        };

        render(initial);
        if (typeof requestAction === 'function') { requestAction('RefreshTile', true); }
    })();
</script>
